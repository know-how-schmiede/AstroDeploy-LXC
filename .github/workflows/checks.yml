name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bash -n bin/setup.sh bin/astroctl bin/update.sh
      - run: shellcheck bin/setup.sh bin/astroctl bin/update.sh
      - run: python -m py_compile lib/astrodeploy.py lib/build.py
      - run: python -m unittest discover -s tests -v
